  robocopy2rust is a pure-Rust suite wrapping Microsoft Robocopy with a native zero-GPU Win32 desktop console
  (robocopy2rust-win32 via WinSafe), a cross-platform Iced GUI (robocopy2rust-iced), an 11-subcommand CLI orchestrator,
  air-gapped HTML/JSON/Markdown audit reporting, .rcj/.bat/.ps1/schtasks exports, and a JSON-RPC 2.0 stdio MCP server.
